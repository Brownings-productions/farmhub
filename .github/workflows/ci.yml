name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the pinned Python (.python-version)
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types (core is strict)
        run: uv run mypy --strict src/farmhub/core
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests (includes tests/safety, which must never be skipped)
        run: uv run pytest
